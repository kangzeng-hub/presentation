name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python development install
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python unit tests
        run: ./scripts/test.sh
      - name: Frontend clean install
        run: npm --prefix frontend ci
      - name: Frontend production build
        run: npm --prefix frontend run build
      - name: OpenAPI contract and generated client
        run: ./scripts/check_api_contract.sh
      - name: Secret scan
        run: ./scripts/secret_scan.sh
      - name: Build and smoke test Compose stack
        run: |
          docker compose config -q
          trap 'docker compose down -v' EXIT
          docker compose build
          docker compose up -d
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null && curl --fail --silent http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          ./scripts/smoke_test.sh
